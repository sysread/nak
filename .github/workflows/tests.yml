name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # `mise run check` is the canonical local gate — unit tests (which
      # themselves include the markdownlint guardrail via
      # tests/markdownlint.test.ts), svelte-check, and ESLint. Keeping
      # CI on the same entry point local developers use means a green
      # `mise run check` locally is a green CI job.
      - name: Full gate
        run: mise run check
