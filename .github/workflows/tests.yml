name: Tests

on:
  pull_request:
  # Reusable: deploy.yml calls this as a required prerequisite so mainline
  # deploys can't ship past a broken check or failing unit test.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test
