name: Deploy

on:
  # Triggered automatically after the Tests workflow finishes on main.
  # Using workflow_run rather than workflow_call means tests.yml still
  # runs standalone on push-to-main (so its badge reflects real runs),
  # and we don't double-execute the test job.
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Re-apply supabase/schema.sql and the Pages-URL auth allowlist to the
  # linked Supabase project before building. Runs the same scripts/sync.mjs
  # that `mise run sync` runs locally, just in its non-interactive CI mode
  # (SUPABASE_PROJECT_REF env var skips the state-file + project-picker
  # path). If this fails the build is skipped — we'd rather fail the deploy
  # than ship an app that expects a column the DB doesn't have.
  sync-supabase:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Sync schema and auth allowlist to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node scripts/sync.mjs

  build:
    needs: sync-supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # When deployed to https://<user>.github.io/<repo>/, Vite must emit
      # asset URLs prefixed with /<repo>/. For user/org pages served from
      # the root (https://<user>.github.io/), set VITE_BASE=/ in repo vars.
      - name: Compute base path
        id: base
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.base }}
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
