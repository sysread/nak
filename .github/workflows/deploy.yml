name: Deploy
# `workflow_run` triggers default the run title to the workflow name
# ("Deploy"), unlike `push` which uses the head commit subject. Borrow
# the upstream Tests run's display_title so the Deploy entry in the
# Actions list reads as the same commit subject the Tests entry shows.
# workflow_dispatch has no upstream run, so fall back to a static label.
run-name: >-
  ${{ github.event.workflow_run.display_title || 'Deploy (manual)' }}

on:
  # Triggered automatically after the Tests workflow finishes on main.
  # Using workflow_run rather than workflow_call means tests.yml still
  # runs standalone on push-to-main (so its badge reflects real runs),
  # and we don't double-execute the test job.
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Re-apply supabase/schema.sql + the Pages-URL auth allowlist and deploy the
  # edge functions to the linked Supabase project before building. The schema
  # sync runs the same scripts/sync.mjs that `mise run sync` runs locally, just
  # in its non-interactive CI mode (SUPABASE_PROJECT_REF env var skips the
  # state-file + project-picker path). If either step fails the build is
  # skipped — we'd rather fail the deploy than ship an app whose backend
  # (schema or functions) is out of sync with it.
  sync-supabase:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Sync schema and auth allowlist to Supabase
        # Opt-in: only runs on forks that have configured the Supabase
        # repo secret + variable. Without the var, the step is a no-op so
        # fresh forks can deploy before they've wired automation up.
        if: vars.SUPABASE_PROJECT_REF != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node scripts/sync.mjs

      - name: Deploy edge functions
        # CI syncs the schema but does not otherwise deploy edge functions, so
        # a schema change that relies on one (the pg_cron backfill POSTs to the
        # venice function's /backfill route) would have no function to hit.
        # Deploy here, behind the same opt-in gate as the schema sync. The
        # supabase CLI comes from mise; auth is the access token, the project is
        # pinned via --project-ref (no `supabase link` in CI), and verify_jwt
        # stays as configured in supabase/config.toml (on).
        if: vars.SUPABASE_PROJECT_REF != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy venice --project-ref ${{ vars.SUPABASE_PROJECT_REF }}

  build:
    needs: sync-supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # When deployed to https://<user>.github.io/<repo>/, Vite must emit
      # asset URLs prefixed with /<repo>/. For user/org pages served from
      # the root (https://<user>.github.io/), set VITE_BASE=/ in repo vars.
      - name: Compute base path
        id: base
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.base }}
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
