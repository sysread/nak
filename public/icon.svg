<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nak">
  <!--
    App icon. Colors mirror the theme-color / background-color declared in
    the PWA manifest (see vite.config.ts) so the Chrome install sheet and
    the splash screen don't flash a mismatched frame around the glyph.
    Designed to work as both favicon and maskable PWA icon — the safe
    zone is the inner 80% circle, so the monogram stays well inside the
    maskable crop that Android applies to adaptive icons.
  -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0b0d10"/>
  <path
    d="M150 370 V142 h44 l124 168 V142 h44 v228 h-44 L194 202 v168 z"
    fill="#e6e9ef"/>
</svg>
