[tools]
node = "20.11.1"
pnpm = "9.12.0"
# gh and supabase are installed via mise's `aqua` backend, which pulls from
# the curated aqua registry so binary names resolve correctly across
# platforms. If aqua fails for you, comment these out and install manually
# — the wizard (`mise run doctor`) will tell you what's missing.
"aqua:cli/cli"      = "latest"
"aqua:supabase/cli" = "latest"

[env]
NODE_ENV = "development"

# ----------------------------------------------------------------------------
# Tasks — run with `mise run <name>` (or `mise run` to pick interactively).
# `mise tasks` lists them with descriptions.
# ----------------------------------------------------------------------------

[tasks.doctor]
description = "Check that all prerequisites are installed and authenticated"
run = "node scripts/doctor.mjs"

[tasks.setup]
description = "Interactive first-time setup wizard (Pages + Supabase + Venice)"
run = "node scripts/bootstrap.mjs"
# `raw = true` gives the task direct TTY access so gh/supabase CLI prompts,
# device-code flows, and password inputs work the same as running the
# script directly.
raw = true

[tasks.pages-enable]
description = "Enable GitHub Pages on this fork with Actions as the source"
run = "node scripts/setup-pages.mjs"
raw = true

[tasks.supabase-init]
description = "Create or link a Supabase project, apply schema, configure auth URLs"
run = "node scripts/setup-supabase.mjs"
raw = true

[tasks.dev]
description = "Run the Vite dev server"
run = "pnpm dev"
raw = true

[tasks.build]
description = "Build the PWA for production"
run = "pnpm build"

[tasks.test]
description = "Run unit tests"
run = "pnpm test"
