[tools]
node = "20.11.1"
pnpm = "10.33.4"
deno = "2.8.0"
# Only tools the GATE needs live in [tools]. mise resolves this whole set
# before dispatching ANY task, so every entry here is a network fetch that
# `mise run check` must survive - even for a tool the gate never invokes.
# gh and gum are therefore declared on the individual tasks that shell out
# to them (see `tools = { ... }` on setup / pages-enable / doctor /
# supabase-init), which keeps them off the gate's critical path entirely.
#
# This matters because aqua fetches gh through GitHub's API asset endpoint
# rather than a plain release download, and the cloud agent proxy 403s
# api.github.com for repos outside the session's scope. The denial is
# intermittent, not absolute, which is worse: a gh entry in [tools] makes
# the gate fail at random in a sandbox, on a tool it does not use. Pinning
# does not fix this - the pin only skips the releases-LIST call, and the
# asset download still goes through the API. Per-task scoping does fix it.
#
# supabase stays here despite the same aqua backend: eight tasks need it
# (every dev-* and functions-* task), its downloads go straight to the
# release URL rather than the API, and it has never failed in a sandbox.
# Listing it per-task would be noise for no gain.
#
# supabase is PINNED, because `mise run dev-start` drives a local stack
# whose reproducibility is tied to the CLI version: it determines the
# config.toml shape, the Docker image versions pulled, and the
# `supabase status -o json` key names that scripts/dev-local.mjs reads
# (ANON_KEY / SERVICE_ROLE_KEY). A floating `latest` could shift any of
# those under a routine `mise install`. Bump deliberately after confirming
# `mise run dev-start` still reaches Vite on the new version. 2.101.0 is the
# latest verified good (dev-start drove a full local stack on it - start,
# status-key read, schema apply, teardown).
#
# REALTIME CAVEAT (do not "modernize" the local key without reading this):
# this CLI ships realtime image v2.86.3, which authenticates the WebSocket
# apikey by verifying it as a JWT. The modern sb_publishable_ key is opaque,
# not a JWT, so local realtime rejects it (`MalformedJWT`) and the app's live
# message/thread updates silently stop - REST and auth still work, which makes
# it look fine on load. That is upstream bug supabase/cli#4219. Because of it
# dev-local.mjs deliberately writes the LEGACY anon JWT (not the publishable
# key) as the app's client key in nak-local-config.json. Prod is unaffected -
# hosted realtime resolves opaque keys. When a future CLI fixes #4219, this is
# the place to note it: bump, then flip dev-local.mjs's readStatus back to
# prefer PUBLISHABLE_KEY and re-test that realtime connects locally.
"aqua:supabase/cli" = "2.101.0"

# Note: markdownlint-cli2 is a pnpm devDependency — the `deps` task
# below provisions it via `pnpm install --frozen-lockfile`, and every
# gate task `depends` on `deps`. A fresh worktree therefore only needs
# `mise run check` (or `mise run test`, `dev`, `build`); there is no
# separate `pnpm install` step to remember. Keeping the doc-lint
# toolchain on pnpm rather than mise also means a fresh clone can
# `pnpm install && pnpm test` without provisioning mise first, which
# matters for agent-driven / ephemeral-sandbox environments.

[env]
NODE_ENV = "development"

# ----------------------------------------------------------------------------
# Tasks — run with `mise run <name>` (or `mise run` to pick interactively).
# `mise tasks` lists them with descriptions.
# ----------------------------------------------------------------------------

# gh is pinned rather than floating on `latest` because a `latest` spec makes
# aqua call the GitHub releases-list API, which restricted sandboxes 403.
# The pin appears on all three gh tasks below - bump them together.
[tasks.doctor]
description = "Check that all prerequisites are installed and authenticated"
# doctor declares gh so its report matches what the wizard will actually see.
# The binary-presence line then always passes for mise users, which is
# correct - mise is providing it. The load-bearing checks are the ones after
# it (is gh authenticated, does the token carry the repo and workflow
# scopes), and those still exercise the user's real credentials. Running
# `node scripts/doctor.mjs` outside mise still reports a genuinely missing gh.
tools = { "aqua:cli/cli" = "2.74.0" }
run = "node scripts/doctor.mjs"

[tasks.setup]
description = "Interactive first-time setup wizard (Pages + Supabase + Venice)"
tools = { "aqua:cli/cli" = "2.74.0" }
run = "node scripts/bootstrap.mjs"
# `raw = true` gives the task direct TTY access so gh/supabase CLI prompts,
# device-code flows, and password inputs work the same as running the
# script directly.
raw = true

[tasks.pages-enable]
description = "Enable GitHub Pages on this fork with Actions as the source"
tools = { "aqua:cli/cli" = "2.74.0" }
run = "node scripts/setup-pages.mjs"
raw = true

[tasks.supabase-init]
description = "Supabase setup + config: create/link project, apply schema, edit app config (Venice key) via gum, configure auth URLs, seed main user. Re-runnable."
# gum drives the interactive config widgets. The script degrades gracefully
# when gum is absent, so this declaration is a convenience, not a hard dep.
tools = { "aqua:charmbracelet/gum" = "0.16.2" }
run = "node scripts/setup-supabase.mjs"
raw = true

[tasks.sync]
description = "Re-apply schema and Pages URL allowlist to the linked Supabase project. Idempotent; no prompts."
run = "node scripts/sync.mjs"
raw = true

[tasks.user-edit]
description = "Create a Supabase user on the linked project, or reset an existing user's password. Interactive; --email/--password override."
run = "node scripts/user-edit.mjs"
# raw = true so password prompts have direct TTY access (same as setup-supabase).
raw = true

[tasks.branch-cleanup]
description = "Delete remote branches under a given prefix older than N days. Defaults to claude/* and 10 days. Lists candidates and asks for confirmation."
run = "node scripts/branch-cleanup.mjs"
# raw = true so the y/N confirmation prompt has direct TTY access.
raw = true

[tasks.update-venice-skills]
description = "Refresh the vendored Venice API skills in .claude/skills/ from upstream veniceai/skills. Leaves the working tree dirty for review; does not commit."
run = "node scripts/update-venice-skills.mjs"
raw = true

[tasks.deps]
description = "Sync npm devDependencies from the lockfile (idempotent)"
# Chained as a `depends` on every task that needs vitest, svelte-check,
# eslint, markdownlint-cli2, or any other npm-provided binary, so
# `mise run <any gate>` is self-sufficient from a fresh worktree —
# the user should never have to remember a second `pnpm install` step.
# `--frozen-lockfile` keeps the lockfile as the source of truth: a
# lockfile drift fails loudly rather than silently mutating. Cost is
# ~500ms on an up-to-date tree, trivial compared to the gate runtime.
run = "pnpm install --frozen-lockfile"

[tasks.dev-frontend]
description = "Run the Vite dev server only (no backend). The app talks to whatever Supabase the browser config points at; use dev-start for an isolated local backend."
depends = ["deps"]
run = "pnpm dev"
raw = true

[tasks.build]
description = "Build the PWA for production"
depends = ["deps"]
run = "pnpm build"

[tasks.test]
description = "Run unit tests (includes the markdownlint guardrail via tests/markdownlint.test.ts)"
depends = ["deps"]
run = "pnpm test"

[tasks.svelte-check]
description = "Type-check Svelte components (svelte-check)"
depends = ["deps"]
run = "pnpm check"

[tasks.eslint]
description = "Run ESLint with cache"
depends = ["deps"]
run = "pnpm lint"

[tasks.markdownlint]
description = "Lint all tracked markdown via markdownlint-cli2"
depends = ["deps"]
# Globs are quoted so the CLI expands them, not the shell - consistent
# behavior on fish / zsh / bash. Keep this invocation in sync with
# tests/markdownlint.test.ts; the two run the same tool against the
# same targets, one for dev iteration and one as the CI gate.
run = "pnpm exec markdownlint-cli2 'docs/**/*.md' README.md CLAUDE.md 'src/**/CLAUDE.md' 'supabase/**/README.md'"

[tasks.knip]
description = "Scan for dead code: unused files, exports, and dependencies"
depends = ["deps"]
# Knip's strictness is calibrated in knip.json. The `types` /
# `duplicates` / `binaries` / `unlisted` rules are intentionally
# `off` to keep the report focused on actionable dead code rather
# than churning on interface declarations or near-duplicates. Knip
# runs in the gate (`mise run check`) - we do the dishes as we cook,
# so rot in untouched corners gets caught every PR, not deferred.
run = "pnpm knip"

[tasks.check]
description = "Full local gate — tests, Deno island, svelte-check, ESLint, knip, production build — all in parallel"
# All gate components are parallel `depends`, not a serial `run` list.
# mise's DAG scheduler runs independent tasks concurrently, so gate
# time is max(test, svelte-check, eslint, build, knip) ~= 7s instead
# of the serial sum ~30s. All tasks run to completion even if one
# fails; the gate reports all failures at once.
#
# The explicit `deps` dep is belt-and-suspenders: `test` and the
# other tasks already depend on it, but naming it here means a
# future edit that removes a task from the gate won't silently skip
# the install step.
#
# The Deno island (functions-check + functions-test) is in the gate
# because the edge function is where most of the app's logic runs,
# and nothing else type-checks or tests it: deploy bundles without
# checking, and vitest never sees Deno code.
#
# `pnpm build` is part of the gate because Vite + vite-plugin-pwa
# failures (Rollup IIFE/code-splitting conflicts in worker bundles,
# PWA manifest-injection errors, dynamic-import graphs that tsc is
# happy with but Rollup chokes on) surface ONLY at `vite build`
# time - svelte-check and tsc don't see them. The Deploy workflow
# runs supabase/schema.sql BEFORE the build step, so a build-only
# failure means schema + auth-allowlist changes ship to the linked
# Supabase project while the new bundle never lands on Pages -
# forcing a manual schema rollback to re-align. Adding the build to
# the gate makes Tests fail on the PR / push, which in turn blocks
# the workflow_run trigger that would kick off Deploy.
#
# Markdownlint rides the test dep (tests/markdownlint.test.ts calls
# the programmatic API); there's no separate markdownlint invocation
# here.
depends = ["deps", "test", "functions-check", "functions-test", "svelte-check", "eslint", "build", "knip"]

[tasks.dev-start]
description = "Isolated local dev: bring up a local Supabase stack (Docker), provision it, serve edge functions, drive embedding backfill on an interval (NAK_DEV_BACKFILL=0 to disable), run Vite, and tear the stack down on exit. Never touches the linked cloud project."
# deps so a fresh worktree has Vite/etc; raw = true so the foreground Vite
# server, the slow `supabase start` image pull, and the optional Venice-key
# prompt all have direct TTY access and Ctrl-C reaches the script.
# bundle-docs writes the research_docs corpus the function imports at load
# time; running it here means a fresh worktree boots without manual steps.
depends = ["deps", "bundle-docs"]
run = "node scripts/dev-local.mjs"
raw = true

[tasks.dev-stop]
description = "Stop the local Supabase stack. The crash-cleanup fallback for a dev-start that exited without tearing down. Data is preserved; add --no-backup to supabase stop for a clean wipe."
run = "supabase stop"
raw = true

[tasks.dev-sql]
description = "Run SQL against the LOCAL Supabase stack via psql (loopback-guarded). SQL from args or stdin: `mise run dev-sql \"select count(*) from public.threads\"`. The local stack must be up (dev-start); the MCP/cloud tools can't see it. Read-only by habit, but it's raw psql - it'll run whatever you give it."
# raw = true so args and stdin reach the script verbatim (multi-line SQL,
# quoted identifiers) instead of going through mise's own arg parsing.
run = "node scripts/dev-sql.mjs"
raw = true

[tasks.dev-backfill-cron]
description = "DEV SHIM: poll the local /backfill route on an interval, standing in for the hosted pg_cron job (the local stack has no pg_cron). dev-start runs this by default; use the task standalone to drive backfill against an already-running stack or with a custom interval. Arg or NAK_BACKFILL_INTERVAL = seconds (default 60)."
# raw = true so Ctrl-C reaches the script and its tick logs stream to the TTY.
run = "node scripts/dev-backfill-cron.mjs"
raw = true

# Edge functions (supabase/functions) are a Deno island - own toolchain, run
# via deno / the supabase CLI, not pnpm. See supabase/functions/README.md.

[tasks.functions-test]
description = "Deno unit tests for the edge functions (offline - fake fetch, no network or Supabase). Pure logic in _shared; the handler glue is exercised via dev-start's functions serve."
# --config points deno at the functions' import map; the tests/ dir holds only
# the pure offline tests, so this stays network-free after deno caches std.
run = "deno test --config supabase/functions/deno.json supabase/functions/tests/"

[tasks.functions-check]
description = "Type-check every edge-function entrypoint with deno check"
# deno test only type-checks the test-import graph, and `supabase
# functions deploy` bundles with esbuild (no type-check at all) - so
# without this task, a type error in a handler-graph corner no test
# imports surfaces NOWHERE and ships latent. Checking the entrypoints
# covers the full import graph each function deploys with.
# bundle-docs first: venice imports the gitignored research-docs
# corpus, which doesn't exist on a fresh clone until the bundler runs.
depends = ["bundle-docs"]
run = "deno check --config supabase/functions/deno.json supabase/functions/venice/index.ts supabase/functions/recipe-image-gc/index.ts supabase/functions/grocery-image-gc/index.ts supabase/functions/attachment-gc/index.ts supabase/functions/wiki-record-file-gc/index.ts"

[tasks.bundle-docs]
description = "Bundle docs/user + docs/dev into the function-side research_docs corpus (supabase/functions/venice/_generated/research-docs-corpus.ts). Gitignored output; dev-start, functions-serve, and functions-deploy all depend on it."
run = "node scripts/bundle-research-docs.mjs"

[tasks.functions-serve]
description = "Serve edge functions locally (supabase functions serve). dev-start already runs this alongside Vite; use standalone to serve against an already-running stack."
depends = ["bundle-docs"]
run = "supabase functions serve"
raw = true

[tasks.functions-deploy]
description = "Deploy the venice edge function to the linked Supabase project."
depends = ["bundle-docs"]
run = "supabase functions deploy venice"
raw = true
