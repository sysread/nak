<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content makes the on-screen keyboard
      shrink the layout viewport (Chrome on Android 108+ defaults to
      overlaying the keyboard on the page instead, which leaves the
      composer hidden underneath it when the user returns to the app
      with the keyboard already open). iOS Safari ignores this key; the
      visualViewport listener in src/lib/keyboard-inset.ts covers it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="Nak — a bring-your-own-infrastructure AI chat PWA using Venice.ai and Supabase." />
    <!--
      SVG favicon. Declaring it explicitly stops the browser from
      auto-requesting /favicon.ico and 404-ing on hosts (GitHub Pages)
      that don't have one. SVG renders crisply at any DPI so there's no
      need to ship PNG fallbacks for modern browsers.
    -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Nak</title>
    <script>
      // Apply the cached theme before CSS paints to avoid a flash of
      // wrong-theme. Runs in <head>, so it has to be ES5-compatible
      // (Vite doesn't transform inline scripts). See src/lib/theme.ts for
      // the matching writer.
      (function () {
        try {
          var raw = localStorage.getItem('nak:theme:v1');
          var mode = 'system';
          var accent = 'blue';
          var style = 'soft';
          if (raw) {
            var parts = raw.split('|');
            if (parts[0] === 'light' || parts[0] === 'dark' || parts[0] === 'system') mode = parts[0];
            if (parts[1]) accent = parts[1];
            if (parts[2] === 'terminal') style = parts[2];
          }
          var effective = mode;
          if (mode === 'system') {
            effective = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', effective);
          root.setAttribute('data-accent', accent);
          root.setAttribute('data-style', style);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-accent', 'blue');
          document.documentElement.setAttribute('data-style', 'soft');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
